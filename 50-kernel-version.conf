[Unit]
# polkit-agent-helper-1 --socket-activated identifies its peer through SO_PEERPIDFD,
# which the kernel gained in 6.5. Without it the helper exits without authenticating,
# and PolkitAgentSession no longer falls back to the setuid helper once the connect
# has succeeded, so authentication fails outright. Keeping the socket from starting
# on older kernels leaves the setuid path in place instead.
# https://github.com/polkit-org/polkit/issues/639
ConditionKernelVersion=>=6.5
